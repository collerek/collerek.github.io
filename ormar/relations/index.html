<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://ormar-orm.github.io/relations/">
    <link rel="canonical" href="https://ormar-orm.github.io/relations/">
    <title>Redirecting to https://ormar-orm.github.io/ormar/</title>
</head>
<body>
    <h1>Redirecting https://ormar-orm.github.io/ormar/ 🌈</h1>

    <p>
        You're seeing this because you have an old link to ormar's docs.
        Update your bookmarks to the redirected URL!
    </p>
    <p>
        If you are not redirected automatically, follow the
        <a id="dest" href="https://ormar-orm.github.io/relations/">link</a>.
    </p>

    <script>
        let fragment = window.location.hash;
        let redirectUrl = `https://ormar-orm.github.io/relations/${fragment}`;
        setTimeout(function() {
            window.location=redirectUrl
        }, 5000);
        document.getElementById("dest").setAttribute("href", redirectUrl);
    </script>
</html>
